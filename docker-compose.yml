  version: '3.9'

  services:
    postgres:
      image: postgres:16-alpine
      container_name: ecclesiastic-postgres
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        DB_HOST: postgres
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./init-scripts:/docker-entrypoint-initdb.d
      networks:
        - ecclesiastic-network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
        interval: 10s
        timeout: 5s
        retries: 5

    api:
      build:
        context: ./Backend
        dockerfile: Dockerfile
      container_name: ecclesiastic-api
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        DB_HOST: postgres
        SPRING_PROFILES_ACTIVE: dev
        JWT_SECRET: ${JWT_SECRET}
        ENCRYPT_KEY: ${ENCRYPT_KEY}
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - ecclesiastic-network

    web:
      build:
        context: ./Backend
        dockerfile: Dockerfile
      container_name: ecclesiastic-web
      ports:
        - "3000:3000"
      depends_on:
        - api
      networks:
        - ecclesiastic-network
      environment:
        REACT_APP_API_URL: http://localhost:8080/api/v1

  volumes:
    postgres_data:

  networks:
    ecclesiastic-network:
      driver: bridge