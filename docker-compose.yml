  version: '3.9'

  services:
    postgres:
      image: postgres:16-alpine
      container_name: ecclesiastic-postgres
      environment:
        POSTGRES_DB: ecclesiastic_db
        POSTGRES_USER: ecclesiastic_user
        POSTGRES_PASSWORD: ecclesiastic_password
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - ecclesiastic-network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ecclesiastic_user"]
        interval: 10s
        timeout: 5s
        retries: 5

    api:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: ecclesiastic-api
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecclesiastic_db
        SPRING_DATASOURCE_USERNAME: ecclesiastic_user
        SPRING_DATASOURCE_PASSWORD: ecclesiastic_password
        SPRING_PROFILES_ACTIVE: dev
        JWT_SECRET: your-super-secret-jwt-key-change-in-production-minimum-256-bits
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - ecclesiastic-network
      volumes:
        - ./backend:/app

    web:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: ecclesiastic-web
      ports:
        - "3000:3000"
      depends_on:
        - api
      networks:
        - ecclesiastic-network
      environment:
        REACT_APP_API_URL: http://localhost:8080/api/v1

  volumes:
    postgres_data:

  networks:
    ecclesiastic-network:
      driver: bridge