  spring:
    application:
      name: ecclesiastic-control-backend-test

    datasource:
      url: jdbc:h2:mem:testdb
      driver-class-name: org.h2.Driver
      username: sa
      password:

    h2:
      console:
        enabled: true

    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: create-drop  # ← Deixa JPA criar as tabelas
      show-sql: false

    flyway:
      enabled: false  # ← IMPORTANTE: Desabilita Flyway nos testes

  logging:
    level:
      root: WARN
      br.com.bitabit.ecclesiacontrol: DEBUG

    jackson:
      default-property-inclusion: non_null

  # JWT Configuration for Tests
  jwt:
      secret: test-secret-key-for-testing-purposes-minimum-256-bits-long
      expiration: 3600000
      refresh-expiration: 604800000