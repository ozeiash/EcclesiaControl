spring:
  application:
    name: ecclesiastic-control-backend-test

  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:ecclesiacontrol_test}
    username: ${TEST_DB_USER:ecclesiastic_user}
    password: ${TEST_DB_PASSWORD:ecclesiastic_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: WARN
    br.com.bitabit.ecclesiacontrol: DEBUG

# JWT Configuration for Tests
jwt:
  secret: test-secret-key-for-testing-purposes-minimum-256-bits-long
  expiration: 3600000
  refresh-expiration: 604800000