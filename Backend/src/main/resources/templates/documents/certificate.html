<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: 'Helvetica', sans-serif; margin: 60px; text-align: center; }
        .border { border: 4px double #444; padding: 50px; }
        h1 { font-size: 14px; letter-spacing: 3px; color: #555; }
        h2 { font-size: 26px; margin: 20px 0; }
        .name { font-size: 24px; font-weight: bold; margin: 30px 0; text-decoration: underline; }
        .body { font-size: 14px; line-height: 1.8; margin: 0 40px; }
        .footer { margin-top: 60px; font-size: 12px; color: #555; }
        .signature { margin-top: 60px; }
        .signature .line { border-top: 1px solid #222; width: 250px; margin: 0 auto; padding-top: 6px; font-size: 12px; }
    </style>
</head>
<body>
<div class="border">
    <h1 th:text="${tenantName}">Nome da Igreja</h1>
    <h2>Certificado</h2>
    <p class="body">Certificamos que</p>
    <div class="name" th:text="${memberName}">Nome do Membro</div>
    <p class="body" th:text="${certificateBody}">Texto do certificado</p>
    <p class="footer" th:text="${issueDate}">Data de emissão</p>
    <div class="signature">
        <div class="line">Assinatura do responsável</div>
    </div>
</div>
</body>
</html>
