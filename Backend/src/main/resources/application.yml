  spring:
    application:
      name: ecclesiastic-control-backend
      version: 1.0.0

    datasource:
      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecclesiastic_db}
      username: ${SPRING_DATASOURCE_USERNAME:ecclesiastic_user}
      password: ${SPRING_DATASOURCE_PASSWORD:ecclesiastic_password}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
      show-sql: false
      open-in-view: false

    flyway:
      enabled: true
      locations: classpath:db/migration

    cache:
      type: simple

    jackson:
      default-property-inclusion: non_null
      serialization:
        write-dates-as-timestamps: false
        indent-output: true
      time-zone: America/Sao_Paulo

  jwt:
    secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production-minimum-256-bits}
    expiration: 3600000
    refresh-expiration: 604800000

  server:
    port: 8080
    servlet:
      context-path: /api/v1
    error:
      include-message: always
      include-binding-errors: always

  logging:
    level:
      root: INFO
      br.com.bitabit.ecclesiacontrol: DEBUG
      org.springframework.security: DEBUG
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file:
      name: logs/ecclesiastic-control.log

  springdoc:
    swagger-ui:
      enabled: true
      path: /swagger-ui.html