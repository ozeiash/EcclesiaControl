name: Tests

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecclesiastic_user
          POSTGRES_PASSWORD: ecclesiastic_password
          POSTGRES_DB: ecclesiacontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecclesiastic_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: ecclesiastic_user
      POSTGRES_PASSWORD: ecclesiastic_password
      ENCRYPT_KEY: dGVzdC1vbmx5LWVuY3J5cHRpb24ta2V5LWNpLTEyMzQ=

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: cd Backend && mvn test

      - name: Resumo de cobertura (JaCoCo)
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open('Backend/target/site/jacoco/jacoco.csv')))
          def pct(c, m):
              cov = sum(int(r[c]) for r in rows); mis = sum(int(r[m]) for r in rows)
              return f"{100*cov/(cov+mis):.1f}% ({cov}/{cov+mis})" if cov+mis else "n/a"
          print("### Cobertura de testes (JaCoCo)")
          print("| Métrica | Cobertura |\n|---|---|")
          print(f"| Linhas | {pct('LINE_COVERED','LINE_MISSED')} |")
          print(f"| Ramos | {pct('BRANCH_COVERED','BRANCH_MISSED')} |")
          print(f"| Instruções | {pct('INSTRUCTION_COVERED','INSTRUCTION_MISSED')} |")
          print(f"| Métodos | {pct('METHOD_COVERED','METHOD_MISSED')} |")
          PY

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Backend/target/site/jacoco

