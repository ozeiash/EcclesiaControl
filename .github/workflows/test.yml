  name: Tests

  on: [push, pull_request]

  jobs:
    backend:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-java@v3
          with:
            java-version: '21'
            distribution: 'temurin'
        - run: cd Backend && mvn test

