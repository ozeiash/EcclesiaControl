name: Tests

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecclesiastic_user
          POSTGRES_PASSWORD: ecclesiastic_password
          POSTGRES_DB: ecclesiacontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecclesiastic_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENCRYPT_KEY: dGVzdC1vbmx5LWVuY3J5cHRpb24ta2V5LWZvci1jaS1waXBlbGluZSE=

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: cd Backend && mvn test

